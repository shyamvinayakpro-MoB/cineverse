    function CineVerseStitchApp() {
      const [moviesList, setMoviesList] = useState(CURATED_MOVIES);
      const [viewingMovie, setViewingMovie] = useState(null);
      const [heroIndex, setHeroIndex] = useState(0);
      const [selectedLanguage, setSelectedLanguage] = useState('All');
      const [selectedGenre, setSelectedGenre] = useState('All');
      const [selectedEra, setSelectedEra] = useState('All'); // 'All' | 'Latest' | 'Classic' | 'Upcoming'
      const [trailerMovie, setTrailerMovie] = useState(null);
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [isWatchlistOpen, setIsWatchlistOpen] = useState(false);
      const [watchlist, setWatchlist] = useState(['kalki-2898-ad', 'aavesham', 'manjummel-boys']);
      const [searchQuery, setSearchQuery] = useState('');
      const [liveTmdbResults, setLiveTmdbResults] = useState([]);
      const [isSearchingTmdb, setIsSearchingTmdb] = useState(false);
      const [langDropdownOpen, setLangDropdownOpen] = useState(false);

      const heroFeatured = useMemo(() => moviesList.slice(0, 4), [moviesList]);
      const currentHero = heroFeatured[heroIndex] || heroFeatured[0];

      // Auto check hash on load or popstate
      useEffect(() => {
        const hash = window.location.hash.replace('#', '');
        if (hash) {
          const found = moviesList.find(m => m.id === hash);
          if (found) setViewingMovie(found);
        }
      }, [moviesList]);

      // Auto advance hero
      useEffect(() => {
        if (viewingMovie) return;
        const timer = setInterval(() => {
          setHeroIndex(prev => (prev + 1) % heroFeatured.length);
        }, 8000);
        return () => clearInterval(timer);
      }, [heroFeatured.length, viewingMovie]);

      // Live TMDB API Search Handler
      useEffect(() => {
        if (!searchQuery.trim() || searchQuery.length < 2) {
          setLiveTmdbResults([]);
          return;
        }

        const delayDebounce = setTimeout(async () => {
          setIsSearchingTmdb(true);
          try {
            const url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(searchQuery)}&include_adult=false&region=IN`;
            const resp = await fetch(url);
            const data = await resp.json();
            if (data && data.results) {
              setLiveTmdbResults(data.results.slice(0, 6));
            }
          } catch (err) {
            console.error('TMDB search error:', err);
          } finally {
            setIsSearchingTmdb(false);
          }
        }, 400);

        return () => clearTimeout(delayDebounce);
      }, [searchQuery]);

      // Load full movie details dynamically from TMDB
      const handleSelectLiveTmdbMovie = async (tmdbMovie) => {
        setIsSearchingTmdb(true);
        try {
          const detailUrl = `https://api.themoviedb.org/3/movie/${tmdbMovie.id}?api_key=${TMDB_API_KEY}&append_to_response=credits,videos`;
          const resp = await fetch(detailUrl);
          const fullData = await resp.json();

          // Extract cast with real portraits
          const topCast = (fullData.credits?.cast || []).slice(0, 4).map(c => ({
            name: c.name,
            role: c.character || 'Lead Cast',
            characterBadge: 'Featured Cast',
            profilePath: c.profile_path ? `https://image.tmdb.org/t/p/w185${c.profile_path}` : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop'
          }));

          // Extract director
          const dirObj = (fullData.credits?.crew || []).find(c => c.job === 'Director');
          const directorName = dirObj ? dirObj.name : 'Renowned Director';

          // Extract composer
          const compObj = (fullData.credits?.crew || []).find(c => c.job === 'Original Music Composer' || c.job === 'Music');
          const composerName = compObj ? compObj.name : 'Hit Composer';

          // Extract trailer key
          const ytObj = (fullData.videos?.results || []).find(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser'));
          const trailerKey = ytObj ? ytObj.key : 'tOY-UvBomOY';

          const mappedMovie = {
            id: `tmdb-${fullData.id}`,
            title: fullData.title,
            originalTitle: fullData.original_title || fullData.title,
            tagline: fullData.tagline || 'Experience the Magic of Indian Cinema.',
            premiseTitle: `The Story: ${fullData.tagline || fullData.title}`,
            synopsis: fullData.overview || 'An extraordinary Indian cinematic spectacle full of high emotional resonance and grandeur.',
            synopsisP2: `Produced on a major budget, this production was directed by ${directorName} and stars celebrated Indian talent.`,
            synopsisP3: `Released internationally with musical compositions by ${composerName}.`,
            posterUrl: fullData.poster_path ? `https://image.tmdb.org/t/p/w780${fullData.poster_path}` : 'https://image.tmdb.org/t/p/w780/rstcAnBeCkxNQjNp3YXrF6IP1tW.jpg',
            backdropUrl: fullData.backdrop_path ? `https://image.tmdb.org/t/p/w1280${fullData.backdrop_path}` : 'https://image.tmdb.org/t/p/w1280/x7f1n1ToNQTzQ26TCeplJTcG4Ht.jpg',
            rating: fullData.vote_average || 8.0,
            voteCount: fullData.vote_count || 1000,
            releaseDate: fullData.release_date || '2024-01-01',
            year: fullData.release_date ? parseInt(fullData.release_date.split('-')[0]) : 2024,
            runtime: fullData.runtime || 150,
            language: fullData.original_language === 'te' ? 'Telugu' : fullData.original_language === 'ml' ? 'Malayalam' : fullData.original_language === 'ta' ? 'Tamil' : fullData.original_language === 'kn' ? 'Kannada' : 'Hindi',
            genres: fullData.genres?.map(g => g.name) || ['Drama', 'Action'],
            universeBadge: 'TMDB Verified Cinema',
            recordBadge: 'Live TMDB Global Sync',
            specialFormat: 'DCI-P3 4K Master',
            director: directorName,
            directorNote: 'Award Winning Filmmaker',
            musicDirector: composerName,
            musicNote: 'Original Theatrical Score',
            cinematographer: 'Leading Cinematographer',
            cinematographerNote: 'Full-Frame CinemaScope',
            producer: fullData.production_companies?.[0]?.name || 'Premier Studio',
            producerNote: 'Major Motion Pictures',
            boxOffice: fullData.revenue ? `₹${Math.round(fullData.revenue / 10000000)} Cr+` : '₹100+ Crore',
            boxOfficeNote: 'Officially registered across international and domestic theatrical markets.',
            budget: fullData.budget ? `₹${Math.round(fullData.budget / 10000000)} Cr` : '₹50 Crore',
            boxOfficeTargetPercent: 180,
            domesticGross: '₹80 Cr+',
            overseasGross: '₹35 Cr+',
            statusBadge: 'Worldwide Theatrical Acclaim',
            cast: topCast.length > 0 ? topCast : [
              { name: 'Lead Indian Star', role: 'Protagonist', characterBadge: 'Lead Role', profilePath: 'https://image.tmdb.org/t/p/w185/u6RVP8ukgLaymeoi5VmX0JRAcCn.jpg' }
            ],
            trailerYoutubeId: trailerKey,
            teasers: [
              { title: `${fullData.title} Official Trailer`, dur: '2m 30s • 4K', tag: 'Theatrical Cut', ytId: trailerKey }
            ],
            streaming: [
              { service: 'Netflix', code: 'NFLX', bg: 'bg-[#E50914]', specs: '4K Ultra HD', link: `https://www.netflix.com/search?q=${encodeURIComponent(fullData.title)}` },
              { service: 'Prime Video', code: 'PRM', bg: 'bg-blue-600', specs: 'Multi-Audio Regional', link: `https://www.primevideo.com/search/ref=atv_nb_sr?phrase=${encodeURIComponent(fullData.title)}` }
            ],
            techSpecs: {
              masterAudio: 'Dolby Atmos • 7.1',
              aspectRatio: '2.39:1',
              digitalIntermediate: '4K Ultra HD',
              budget: fullData.budget ? `₹${Math.round(fullData.budget / 10000000)} Cr` : '₹50 Crore',
              locations: 'India, International',
              subtitles: 'English, Multiple Languages'
            },
            hashtags: [`#${fullData.title.replace(/\s+/g, '')}`, '#IndianCinema', '#TMDBLive'],
            isTrending: true
          };

          // Append to state if not existing
          setMoviesList(prev => [mappedMovie, ...prev.filter(m => m.id !== mappedMovie.id)]);
          setViewingMovie(mappedMovie);
          setIsSearchOpen(false);
          window.location.hash = mappedMovie.id;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
          console.error('Error fetching full TMDB details:', err);
        } finally {
          setIsSearchingTmdb(false);
        }
      };

      const toggleWatchlist = (movie) => {
        setWatchlist(prev => 
          prev.includes(movie.id) ? prev.filter(id => id !== movie.id) : [...prev, movie.id]
        );
      };

      const clearAllWatchlist = () => setWatchlist([]);

      const handleOpenDetails = (movie) => {
        setViewingMovie(movie);
        window.location.hash = movie.id;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleBackToCatalog = () => {
        setViewingMovie(null);
        history.pushState('', document.title, window.location.pathname + window.location.search);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const filteredMovies = useMemo(() => {
        let list = moviesList;
        if (selectedEra === 'Latest') {
          list = list.filter(m => m.isLatest || (m.year >= 2023 && !m.isUpcoming));
        } else if (selectedEra === 'Classic') {
          list = list.filter(m => m.isClassic || (m.year <= 2016 && !m.isUpcoming));
        } else if (selectedEra === 'Upcoming') {
          list = list.filter(m => m.isUpcoming);
        } else if (selectedEra === 'Trending') {
          list = list.filter(m => m.isTrending && !m.isUpcoming);
        }
        return list;
      }, [moviesList, selectedEra]);

      const baseFilteredMovies = useMemo(() => {
        return moviesList.filter(m => {
          const matchLang = selectedLanguage === 'All' || m.language === selectedLanguage;
          const matchGenre = selectedGenre === 'All' || m.genres.includes(selectedGenre);
          return matchLang && matchGenre;
        });
      }, [moviesList, selectedLanguage, selectedGenre]);

      const localSearchResults = useMemo(() => {
        if (!searchQuery.trim()) return [];
        const q = searchQuery.toLowerCase();
        return moviesList.filter(m => 
          m.title.toLowerCase().includes(q) ||
          m.originalTitle.toLowerCase().includes(q) ||
          m.director.toLowerCase().includes(q) ||
          m.language.toLowerCase().includes(q) ||
          m.genres.some(g => g.toLowerCase().includes(q)) ||
          m.cast.some(c => c.name.toLowerCase().includes(q) || c.role.toLowerCase().includes(q))
        );
      }, [searchQuery, moviesList]);

      return (

                >
                  <span className="material-symbols-outlined text-[18px]">home</span>
                  <span>Home</span>
                </button>

                <button

                  className="px-3 py-1.5 rounded-full hover:text-white hover:bg-white/5 transition-colors flex items-center gap-1.5"
                >
                  <span className="material-symbols-outlined text-[18px] text-orange-400">local_fire_department</span>

                </button>

                <button

                  className="px-3 py-1.5 rounded-full hover:text-white hover:bg-white/5 transition-colors flex items-center gap-1.5"
                >
                  <span className="material-symbols-outlined text-[18px] text-purple-400">auto_awesome</span>
                  <span>Universes</span>
                </button>
              </nav>

              {/* Right Action Icons */}
              <div className="flex items-center gap-2 sm:gap-3">
                
                {/* Language Dropdown Selector */}

                  <button

                  {/* Bottom Milestone Overlay */}
                  <div className="absolute bottom-4 left-4 right-4 space-y-1">
                    <span className="text-[10px] font-mono text-[#F59E0B] font-bold uppercase tracking-wider block">
                      {movie.isUpcoming ? 'Anticipated Theatrical Run' : 'Global Theatrical Milestone'}
                    </span>
                    <div className="text-2xl sm:text-3xl font-black font-display text-white">
                      {movie.boxOffice || movie.budget || '₹100+ Cr'}
                    </div>
                    <p className="text-[11px] text-gray-300 leading-tight">
                      {movie.boxOfficeNote || `Ranked among the premier ${movie.language} cinematic triumphs globally.`}
                    </p>
                  </div>
                </div>

                {/* Where to Stream Box (Rendered Dynamically from movie.streaming) */}
                <div className="p-5 rounded-2xl bg-[#141418] border border-white/10 space-y-3.5 shadow-md">
                  <h3 className="font-bold text-white text-sm flex items-center gap-2 font-display">
                    <span className="material-symbols-outlined text-[#F59E0B] text-[18px]">live_tv</span>
                    <span>Where to Stream</span>
                  </h3>
                  
                  <div className="space-y-2.5">
                    {(movie.streaming || [
                      { service: 'Netflix', code: 'NFLX', bg: 'bg-[#E50914]', specs: 'Multi-Language • 4K HDR', link: 'https://www.netflix.com' },
                      { service: 'Prime Video', code: 'PRM', bg: 'bg-blue-600', specs: 'Multi-Language Audio', link: 'https://www.primevideo.com' }
                    ]).map((str, idx) => (
                      <div key={idx} className="flex items-center justify-between p-3 rounded-xl bg-white/5 hover:bg-white/10 transition-colors">
                        <div className="flex items-center gap-3">
                          <div className={`w-9 h-9 rounded-lg ${str.bg || 'bg-blue-600'} flex items-center justify-center font-black text-white text-xs font-mono`}>
                            {str.code}
                          </div>
                          <div>
                            <h4 className="text-xs font-bold text-white font-display">{str.service}</h4>
                            <p className="text-[10px] text-gray-400 font-mono">{str.specs}</p>
                          </div>
                        </div>
                        <a
                          href={str.link}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="px-3 py-1 rounded-full bg-white/10 hover:bg-[#F59E0B] hover:text-black text-xs font-bold text-[#F59E0B] transition-colors"
                        >
                          {str.actionText || 'Watch'}
                        </a>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Technical Specifications Box (Rendered Dynamically from movie.techSpecs) */}
                <div className="p-5 rounded-2xl bg-[#141418] border border-white/10 space-y-3 font-mono text-xs shadow-md">
                  <h3 className="font-bold text-white text-sm flex items-center gap-2 font-display">
                    <span className="material-symbols-outlined text-[#F59E0B] text-[18px]">settings_suggest</span>
                    <span>Technical Specifications</span>
                  </h3>
                  <div className="divide-y divide-white/5 text-gray-300">
                    <div className="flex justify-between py-2">
                      <span className="text-gray-500">Master Audio:</span>
                      <span className="text-white font-medium">{movie.techSpecs?.masterAudio || 'Dolby Atmos Surround'}</span>
                    </div>
                    <div className="flex justify-between py-2">
                      <span className="text-gray-500">Aspect Ratio:</span>
                      <span className="text-white font-medium">{movie.techSpecs?.aspectRatio || '2.39:1 (Widescreen)'}</span>
                    </div>
                    <div className="flex justify-between py-2">
                      <span className="text-gray-500">Digital Intermediate:</span>
                      <span className="text-amber-400 font-medium">{movie.techSpecs?.digitalIntermediate || '4K Master (DCI-P3)'}</span>
                    </div>
                    <div className="flex justify-between py-2">
                      <span className="text-gray-500">Estimated Budget:</span>
                      <span className="text-white font-medium">{movie.budget || '₹50 Crore'}</span>
                    </div>
                    <div className="flex justify-between py-2">
                      <span className="text-gray-500">Filming Locations:</span>
                      <span className="text-gray-300 text-right">{movie.techSpecs?.locations || 'India'}</span>
                    </div>
                    <div className="flex justify-between py-2">
                      <span className="text-gray-500">Subtitles Available:</span>
                      <span className="text-gray-300 text-right">{movie.techSpecs?.subtitles || 'English, Regional'}</span>
                    </div>
                  </div>
                </div>

                {/* Box Office Target Tracker (Calculated Dynamically from movie stats) */}
                <div className="p-5 rounded-2xl bg-[#141418] border border-white/10 space-y-4 shadow-md">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-white text-sm font-display">Box Office Target Tracker</h3>
                    <span className="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                      {movie.boxOfficeTargetPercent || 150}% of Target
                    </span>
                  </div>

                  <div className="flex items-center gap-4">
                    {/* SVG Radial Meter */}
                    <div className="relative w-20 h-20 shrink-0 flex items-center justify-center">
                      <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                        <path
                          className="text-white/10"
                          strokeWidth="3.5"
                          stroke="currentColor"
                          fill="none"
                          d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                        />
                        <path
                          className="text-[#F59E0B]"
                          strokeDasharray={`${Math.min(movie.boxOfficeTargetPercent || 150, 100)}, 100`}
                          strokeWidth="3.5"
                          strokeLinecap="round"
                          stroke="currentColor"
                          fill="none"
                          d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                        />
                      </svg>
                      <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                        <span className="font-display font-black text-sm text-[#F59E0B]">
                          {movie.boxOfficeTargetPercent || 150}%
                        </span>
                      </div>
                    </div>

                    <div className="space-y-1 text-xs">
                      <p className="text-gray-300">
                        <span className="text-gray-500 font-mono">Domestic Gross:</span> <strong className="text-white font-mono">{movie.domesticGross || '₹75 Cr+'}</strong>
                      </p>
                      <p className="text-gray-300">
                        <span className="text-gray-500 font-mono">Overseas Gross:</span> <strong className="text-white font-mono">{movie.overseasGross || '₹30 Cr+'}</strong>
                      </p>
                      <p className="text-xs font-bold text-emerald-400 font-display pt-0.5">
                        Status: {movie.statusBadge || 'Theatrical Hit'}
                      </p>
                    </div>
                  </div>
                </div>

              </div>

              {/* RIGHT COLUMN: Synopsis, Teasers, Cast Cards, Creative Team (8 cols) */}
              <div className="lg:col-span-8 space-y-8">
                
                {/* Dynamic Premise & Storyline */}
                <div className="p-6 sm:p-8 rounded-3xl bg-[#141418] border border-white/10 space-y-4 shadow-md">
                  <h2 className="text-xl sm:text-2xl font-bold font-display text-white flex items-center gap-2">
                    <span className="material-symbols-outlined text-[#F59E0B]">auto_stories</span>
                    <span>{movie.premiseTitle || `The Story: ${movie.tagline || movie.title}`}</span>
                  </h2>
                  <div className="text-gray-300 text-sm sm:text-base leading-relaxed space-y-3">
                    <p>{movie.synopsis}</p>
                    {movie.synopsisP2 && <p>{movie.synopsisP2}</p>}
                    {movie.synopsisP3 && <p>{movie.synopsisP3}</p>}
                  </div>
                  
                  {/* Dynamic Hashtags */}
                  <div className="flex flex-wrap gap-2 pt-2 font-mono text-xs">
                    {(movie.hashtags || [`#${movie.title.replace(/\s+/g, '')}`, `#${movie.language}Cinema`, '#Blockbuster']).map((tag, idx) => (
                      <span key={idx} className="px-3 py-1 rounded-full bg-white/5 border border-white/5 text-[#F59E0B] font-medium">
                        {tag}
                      </span>
                    ))}
                  </div>
                </div>

                {/* Dynamic Featured Teasers & Behind-The-Scenes */}
                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="text-lg font-bold font-display text-white flex items-center gap-2">
                      <span className="material-symbols-outlined text-[#F59E0B]">smart_display</span>
                      <span>Featured Teasers & Behind-The-Scenes</span>
                    </h3>
                    <button 
                      onClick={() => onWatchTrailer(movie)} 
                      className="text-xs text-[#F59E0B] font-mono hover:underline flex items-center gap-1"
                    >
                      <span>Watch Full Trailer</span>
                      <span>→</span>
                    </button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    {(movie.teasers && movie.teasers.length > 0 ? movie.teasers : [
                      { title: `${movie.title} Official Trailer`, dur: '2m 30s • 4K', tag: 'Theatrical Cut', ytId: movie.trailerYoutubeId }
                    ]).map((vid, i) => (
                      <div
                        key={i}
                        onClick={() => onWatchTrailer({ ...movie, trailerYoutubeId: vid.ytId || movie.trailerYoutubeId })}
                        className="group relative rounded-2xl overflow-hidden bg-[#141418] border border-white/10 hover:border-amber-400/60 cursor-pointer aspect-video flex flex-col justify-end p-3 shadow-md"
                      >
                        <img 
                          src={movie.backdropUrl} 
                          className="absolute inset-0 w-full h-full object-cover brightness-60 group-hover:scale-105 transition-transform duration-300" 
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                        <div className="absolute inset-0 flex items-center justify-center">
                          <div className="w-10 h-10 rounded-full bg-[#F59E0B] text-black flex items-center justify-center font-bold shadow-lg group-hover:scale-110 transition-transform">
                            ▶
                          </div>
                        </div>
                        <div className="relative z-10 space-y-0.5">
                          <span className="text-[9px] font-mono uppercase text-amber-400 font-bold">{vid.tag}</span>
                          <p className="text-xs font-bold text-white truncate font-display">{vid.title}</p>
                          <p className="text-[10px] text-gray-400 font-mono">{vid.dur}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Key Legendary Cast & Characters (Rendered Dynamically from movie.cast) */}
                <div className="p-6 sm:p-8 rounded-3xl bg-[#141418] border border-white/10 space-y-5 shadow-md">
                  <div className="flex items-center justify-between">
                    <h3 className="text-lg font-bold font-display text-white flex items-center gap-2">
                      <span className="material-symbols-outlined text-[#F59E0B]">groups</span>
                      <span>Key Legendary Cast & Characters</span>
                    </h3>
                    <span className="text-xs font-mono text-gray-400">{movie.cast?.length || 0} Lead Stars</span>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
                    {(movie.cast || []).map((c, i) => (
                      <div 
                        key={i} 
                        className="p-3.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/5 transition-all flex flex-col items-center text-center shadow-md group"
                      >
                        {/* Circular Portrait with Glowing Amber Ring */}
                        <div className="w-20 h-20 rounded-full overflow-hidden mb-3 ring-2 ring-[#F59E0B]/50 shadow-lg bg-[#0e0e12] shrink-0">
                          <img 
                            src={c.profilePath || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop'} 
                            alt={c.name}
                            onError={(e) => {
                              e.target.onerror = null;
                              e.target.src = 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop';
                            }}
                            className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300" 
                          />
                        </div>

                        {/* Actor & Character Info */}
                        <h4 className="font-bold text-white text-sm font-display truncate w-full">{c.name}</h4>
                        <p className="text-xs text-[#F59E0B] font-semibold truncate w-full pt-0.5">{c.role}</p>
                        <span className="text-[10px] text-gray-400 font-mono mt-1 block truncate w-full">
                          {c.characterBadge || 'Key Protagonist'}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Visionary Creative Team Spotlight (Rendered Dynamically from movie credits) */}
                <div className="p-6 rounded-3xl bg-[#141418] border border-white/10 space-y-4 shadow-md">
                  <h3 className="text-xs font-mono font-bold uppercase tracking-wider text-[#F59E0B] flex items-center gap-1.5">
                    <span className="material-symbols-outlined text-[16px]">movie_filter</span>
                    <span>Visionary Creative Team Spotlight</span>
                  </h3>
                  
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    
                    <div className="p-3.5 rounded-2xl bg-white/5 border border-white/5 space-y-1">
                      <span className="text-[10px] text-gray-400 font-mono uppercase block">Director & Writer</span>
                      <p className="text-xs font-bold text-white font-display">{movie.director}</p>
                      <p className="text-[10px] text-amber-400 font-mono">{movie.directorNote || 'National Award Winner'}</p>
                    </div>

                    <div className="p-3.5 rounded-2xl bg-white/5 border border-white/5 space-y-1">
                      <span className="text-[10px] text-gray-400 font-mono uppercase block">Original Score & Music</span>
                      <p className="text-xs font-bold text-white font-display">{movie.musicDirector}</p>
                      <p className="text-[10px] text-amber-400 font-mono">{movie.musicNote || 'Sensational Score & Rhythms'}</p>
                    </div>

                    <div className="p-3.5 rounded-2xl bg-white/5 border border-white/5 space-y-1">
                      <span className="text-[10px] text-gray-400 font-mono uppercase block">Cinematographer</span>
                      <p className="text-xs font-bold text-white font-display">{movie.cinematographer || 'Director of Photography'}</p>
                      <p className="text-[10px] text-gray-400 font-mono">{movie.cinematographerNote || '2.39:1 Panoramic Scope'}</p>
                    </div>

                    <div className="p-3.5 rounded-2xl bg-white/5 border border-white/5 space-y-1">
                      <span className="text-[10px] text-gray-400 font-mono uppercase block">Producer & Studio</span>
                      <p className="text-xs font-bold text-white font-display">{movie.producer || 'Leading Indian Studio'}</p>
                      <p className="text-[10px] text-gray-400 font-mono">{movie.producerNote || 'Major Production House'}</p>
                    </div>

                  </div>
                </div>

              </div>

            </div>
          </div>

          {/* 5. RECOMMENDATIONS CAROUSEL (DYNAMICALLY FILTERED) */}
          <section className="py-12 bg-[#0c0c0e] border-t border-white/10">
            <div className="max-w-7xl mx-auto px-4 sm:px-8 space-y-4">
              
              <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-3">
                <div>
                  <h2 className="text-xl sm:text-2xl font-bold font-display text-white">
                    More Like This: {movie.genres[0]} & {movie.language} Cinema
                  </h2>
                  <p className="text-xs text-gray-400 mt-0.5">
                    Spectacular world-building, mythological roots, and larger-than-life Indian cinema.
                  </p>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => scrollRail(-300)}
                    className="w-9 h-9 rounded-full glass-card hover:bg-white/20 text-white flex items-center justify-center font-bold"
                    title="Previous"
                  >
                    ‹
                  </button>
                  <button
                    onClick={() => scrollRail(300)}
                    className="w-9 h-9 rounded-full glass-card hover:bg-white/20 text-white flex items-center justify-center font-bold"
                    title="Next"
                  >
                    ›
                  </button>
                </div>
              </div>

              <div id="relatedMoviesRail" className="flex gap-4 sm:gap-5 overflow-x-auto no-scrollbar scroll-smooth py-2">
                {recommendations.map(rec => (
                  <MovieCardView
                    key={rec.id}
                    movie={rec}
                    onSelect={(m) => onSelectMovie(m)}
                    onWatchTrailer={onWatchTrailer}
                    isWatchlisted={watchlist.includes(rec.id)}
                    onToggleWatchlist={onToggleWatchlist}
                  />
                ))}
              </div>

            </div>
          </section>

        </div>
      );
    }

    // --- REUSABLE MOVIE CARD VIEW ---
    function MovieCardView({ movie, onSelect, onWatchTrailer, isWatchlisted, onToggleWatchlist, countdownBadge }) {
      return (
        <div className="group relative flex-none w-[185px] sm:w-[220px] rounded-2xl overflow-hidden bg-[#141418] border border-white/10 shadow-xl transition-all duration-300 hover:border-[#F59E0B]/60 hover:-translate-y-1.5">
          <div className="relative aspect-[2/3] w-full overflow-hidden bg-[#101014]">
            <img
              src={movie.posterUrl}
              alt={movie.title}
              className="w-full h-full object-cover transform transition-transform duration-500 group-hover:scale-105"
            />
            <div className="absolute inset-0 bg-gradient-to-t from-[#141418] via-transparent to-transparent pointer-events-none"></div>

            <div className="absolute top-2.5 left-2.5 right-2.5 flex items-center justify-between z-10">
              <span className="glass-badge px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider text-amber-300">
                {movie.language}
              </span>
              <button
                onClick={(e) => { e.stopPropagation(); onToggleWatchlist(movie); }}
                className={`p-1.5 rounded-full glass-badge transition-transform hover:scale-110 ${isWatchlisted ? 'bg-[#E50914] text-white border-transparent' : 'text-gray-300 hover:text-amber-400'}`}
              >
                🔖
              </button>
            </div>

            {countdownBadge && (
              <div className="absolute bottom-2 left-2 z-10">
                <span className="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-amber-500 text-black font-mono">
                  {countdownBadge}
                </span>
              </div>
            )}

            <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2 z-20">
              <button
                onClick={() => onWatchTrailer(movie)}
                className="w-10 h-10 rounded-full bg-[#F59E0B] text-black font-bold flex items-center justify-center shadow-lg hover:scale-110 active:scale-95 transition-transform"
                title="Watch Trailer"
              >
                ▶
              </button>
              <button
                onClick={() => onSelect(movie)}
                className="w-10 h-10 rounded-full glass-card text-white flex items-center justify-center hover:scale-110 active:scale-95 transition-transform"
                title="View Details"
              >
                ℹ️
              </button>
            </div>
          </div>

          <div className="p-3.5 cursor-pointer space-y-1" onClick={() => onSelect(movie)}>
            <div className="flex items-center justify-between text-xs text-gray-400 font-mono">
              <span>{movie.year}</span>
              <span className="font-bold text-amber-400">★ {movie.rating.toFixed(1)}</span>
            </div>
            <h3 className="font-display font-bold text-white text-sm truncate group-hover:text-amber-400 transition-colors">
              {movie.title}
            </h3>
            <p className="text-[11px] text-gray-400 truncate">
              {movie.genres.join(' • ')}
            </p>
          </div>
        </div>
      );
    }

    ReactDOM.render(<CineVerseStitchApp />, document.getElementById('root'));
  </script>
</body>
</html>
