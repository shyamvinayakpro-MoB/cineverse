<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="4"/>
  
  <!-- Clapperboard Body -->
  <g filter="url(#glow)">
    <rect x="96" y="140" width="320" height="232" rx="24" fill="#18181E" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
    
    <!-- Top Clapper with diagonal stripes -->
    <path d="M 96 164 C 96 150.7 106.7 140 120 140 L 392 140 C 405.3 140 416 150.7 416 164 L 416 200 L 96 200 Z" fill="#0C0C0F"/>
    
    <!-- Diagonal Gold Stripes -->
    <polygon points="120,140 155,140 115,200 80,200" fill="url(#goldGrad)"/>
    <polygon points="190,140 225,140 185,200 150,200" fill="url(#goldGrad)"/>
    <polygon points="260,140 295,140 255,200 220,200" fill="url(#goldGrad)"/>
    <polygon points="330,140 365,140 325,200 290,200" fill="url(#goldGrad)"/>
    <polygon points="400,140 416,140 416,160 395,200 360,200" fill="url(#goldGrad)"/>
    
    <!-- Horizontal Divider -->
    <line x1="96" y1="200" x2="416" y2="200" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
    
    <!-- Play Triangle -->
    <polygon points="230,240 310,285 230,330" fill="url(#goldGrad)"/>
  </g>
  
  <!-- Title Badge -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">CINE<tspan fill="#F59E0B">VERSE</tspan></text>
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#A1A1AA" text-anchor="middle">INDIAN CINEMA ELITE</text>
</svg>